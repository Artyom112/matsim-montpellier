[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "matsim-analysis"
version = "0.1.0"
description = "Анализ выходных данных MATSim-прогонов Монпелье (events, trips, объёмы по связям)"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "zstandard",
    "pyarrow",
]

[project.optional-dependencies]
test = ["pytest", "numpy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
